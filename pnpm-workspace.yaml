# Supply chain defense: refuse to resolve any package version
# published less than 7 days (10080 minutes) ago.
# See: https://pnpm.io/settings#minimumreleaseage
#
# Exclude-list scope: blanket bypass of the quarantine for a package or
# scope. Use ONLY for packages that need to ship on day-0 by policy. Do
# NOT add entries here for one-off security patches — the patch ages
# past 7 days on its own and the exclude turns into dead weight. For
# per-version emergency exceptions during the quarantine window, use
# `.dep-age-allowlist` (pre-commit allowlist) instead.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Tauri JS plugins must stay in lockstep with the Rust crates of the
  # same name. A fresh `tauri-plugin-fs` crate release paired with a
  # `@tauri-apps/plugin-fs` JS release MUST be installable on day 0 to
  # keep the frontend/Rust pair compatible. Continuous policy, not a
  # one-off patch.
  - '@tauri-apps/*'

# Supply chain hardening. The first two are pnpm v11 defaults (true) —
# pinned explicitly so a future pnpm default flip can't silently disable
# them. `trustPolicy` defaults to OFF, so it MUST be set to take effect.
#
# - blockExoticSubdeps: transitive deps may only resolve from the
#   registry — git URLs and direct tarball URLs are rejected for
#   subdeps (direct deps in package.json are exempt).
# - strictDepBuilds: abort `pnpm install` with a non-zero exit if any
#   dependency declares an unreviewed install/build script not listed in
#   `allowBuilds` below. Backstops the allowBuilds gate.
# - trustPolicy=no-downgrade: refuse a version whose publish-time trust
#   level dropped vs an earlier release (e.g. a dep that previously
#   shipped with OIDC/provenance suddenly ships without it) — a common
#   account-compromise signal.
blockExoticSubdeps: true
strictDepBuilds: true
trustPolicy: no-downgrade

overrides:
  cookie: '>=0.7.0'

# Dependencies allowed to run install/build scripts. pnpm 11 (see
# package.json#packageManager) replaced the v10 `onlyBuiltDependencies`
# list with the `allowBuilds` map and made the gate strict by default:
# any dependency declaring an install/build script that is NOT listed
# here aborts `pnpm install` with ERR_PNPM_IGNORED_BUILDS in CI. esbuild
# (pulled by vite) links its platform binary; core-js (pulled by
# feather-icons) runs a donation-notice postinstall.
allowBuilds:
  esbuild: true
  core-js: true
