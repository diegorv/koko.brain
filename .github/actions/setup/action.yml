name: "Setup Environment"
description: "Setup pnpm, Node.js, Rust, sccache, and dependency caching"

inputs:
  rust:
    description: "Install Rust toolchain"
    required: false
    default: "true"
  rust-targets:
    description: "Rust targets to install"
    required: false
    default: "aarch64-apple-darwin"
  rust-cache-key:
    description: >-
      Optional `shared-key` passed to Swatinem/rust-cache. When set, all
      jobs that pass the same value share a single cache entry (instead
      of each job getting its own `v0-rust-<job_id>-...` slot). Use this
      for jobs that run the same cargo invocation (e.g. `cargo build
      --release --target aarch64-apple-darwin` in nightly.yml and
      release.yml) so a successful build in one workflow primes the
      cache for the other. Leave empty for jobs whose cargo invocation
      produces different artifacts (e.g. ci.yml's `cargo test`
      debug+host build), so they keep their own per-job cache and
      don't clobber each other.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "22.17"
        cache: "pnpm"

    - name: Install frontend dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Setup Rust
      if: inputs.rust == 'true'
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        # Pinned on purpose: bump deliberately, not with the runner image.
        toolchain: "1.98.0"
        targets: ${{ inputs.rust-targets }}
        # `strip = true` needs rust-objcopy, which links libLLVM from llvm-tools.
        components: llvm-tools

    # The runner's rustup multi-call shim misroutes `cargo` to rustup-init.
    - name: Pin cargo to toolchain binary (bypass rustup argv[0] dispatch)
      if: inputs.rust == 'true'
      shell: bash
      run: |
        set -euo pipefail
        REAL_CARGO=$(rustup which cargo)
        REAL_DIR=$(dirname "$REAL_CARGO")
        echo "Real cargo: $REAL_CARGO"
        echo "$REAL_DIR" >> "$GITHUB_PATH"
        if ! "$REAL_CARGO" --version >/dev/null 2>&1; then
          echo "::error::toolchain cargo at $REAL_CARGO is not executable"
          exit 1
        fi
        "$REAL_CARGO" --version

    - name: Setup sccache
      if: inputs.rust == 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

    - name: Configure sccache GHA backend
      if: inputs.rust == 'true'
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

    - name: Cache Rust dependencies and build artifacts
      if: inputs.rust == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: "src-tauri -> target"
        shared-key: ${{ inputs.rust-cache-key }}
