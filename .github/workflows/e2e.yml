name: E2E

# Playwright end-to-end suite, in its own workflow rather than as a CI job.
#
# Scope:
#   - pull_request against `main`: gate before merge. This is the only
#     pre-merge E2E run; main is protected by the PR check, so a commit
#     never reaches main without E2E having passed.
#   - workflow_call: invoked by release.yml on tag push as a hard gate
#     for the macOS build (release builds never publish without E2E
#     passing), and by run-all.yml for manual full-sweep runs.
#
# Intentionally NOT triggered on push:main. Every commit to main has
# already passed E2E in its PR; re-running on the merge SHA would
# duplicate work without adding signal. Nightly.yml does not include
# E2E either (by design — see its top-of-file comment); the only
# post-merge E2E gate is at release time, where it blocks the build
# alongside frontend+rust.

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "static/**"
      - "e2e/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "tsconfig.json"
      - "svelte.config.*"
      - "vite.config.*"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "components.json"
      - "scripts/e2e.sh"
  workflow_dispatch:
  # Reusable: invoked by `.github/workflows/release.yml` (as a gate
  # before build-macos) and `.github/workflows/run-all.yml`.
  workflow_call:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Frontend (Playwright E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust: "false"

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E suite
        run: bash scripts/e2e.sh

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            /tmp/kokobrain-e2e-server.log
          retention-days: 7
