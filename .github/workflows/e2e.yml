name: E2E

# Playwright end-to-end suite, in its own workflow rather than as a CI job.
#
# Scope:
#   - workflow_call: the pull_request gate lives in pr.yml now — it calls
#     this workflow (change-gated on the frontend paths that used to be
#     this file's pull_request filter) and folds it into the aggregate
#     `PR success` check. Also invoked by release.yml on tag push as a
#     hard gate for the macOS build (release builds never publish without
#     E2E passing), and by run-all.yml for manual full-sweep runs.
#   - workflow_dispatch: manual run.
#
# Intentionally NOT triggered on push:main. nightly.yml makes the
# post-merge invocation via workflow_call (for the commits it builds
# at all — it skips docs-only and version-bump SHAs), where this suite
# runs for signal only and does not gate the nightly build. The only
# post-merge E2E *gate* is at release time, where it blocks the build
# alongside frontend+rust.

permissions:
  contents: read

on:
  workflow_dispatch:
  # Reusable: invoked by `.github/workflows/pr.yml` (the pull_request
  # gate, change-gated on frontend paths), `.github/workflows/release.yml`
  # (as a gate before build-macos), `.github/workflows/nightly.yml`
  # (signal only, gates nothing), and `.github/workflows/run-all.yml`.
  workflow_call:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Frontend (Playwright E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust: "false"

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E suite
        run: bash scripts/e2e.sh

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            /tmp/kokobrain-e2e-server.log
          retention-days: 7
