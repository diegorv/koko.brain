name: E2E

# Playwright end-to-end suite, in its own workflow rather than as a CI job.
#
# Scope:
#   - pull_request against `main`: gate before merge.
#   - push to `main`: covers the "commit straight to main without a tag"
#     flow. Without this trigger, a direct commit that breaks Playwright
#     is invisible until the next time someone tags a release — the
#     PR run never happened and release-time re-run lives in the future.
#   - workflow_call: invoked by release.yml on tag push and by run-all.yml
#     for manual full-sweep runs.

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "static/**"
      - "e2e/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "tsconfig.json"
      - "svelte.config.*"
      - "vite.config.*"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "components.json"
      - "scripts/e2e.sh"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "static/**"
      - "e2e/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "tsconfig.json"
      - "svelte.config.*"
      - "vite.config.*"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "components.json"
      - "scripts/e2e.sh"
  workflow_dispatch:
  # Reusable: invoked by `.github/workflows/release.yml` (as a gate
  # before build-macos) and `.github/workflows/run-all.yml`.
  workflow_call:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Frontend (Playwright E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust: "false"

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E suite
        run: bash scripts/e2e.sh

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            /tmp/kokobrain-e2e-server.log
          retention-days: 7
