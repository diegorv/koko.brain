name: E2E

# Playwright end-to-end suite, in its own workflow rather than as a CI job.
#
# Scope: PRs against `main` and release tags only.
#
#   - pull_request: catches regressions before merge.
#   - push of `*.*.*-alpha` tags: safety-net run alongside the release
#     pipeline. Release itself does NOT wait on this — if E2E flakes on
#     tag push, the binary still builds, signs, and ships. The PR run
#     before the merge is the real gate; this tag run is informational.
#
# Intentionally NOT triggered on direct pushes to `main`. The project
# workflow is "PR -> merge, or commit + tag together". Running E2E on
# every commit-to-main push would double the cost without adding signal:
# the PR run before the merge already covered the diff, and the tag run
# will cover it again before release.

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "static/**"
      - "e2e/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "tsconfig.json"
      - "svelte.config.*"
      - "vite.config.*"
      - "tailwind.config.*"
      - "postcss.config.*"
      - "components.json"
      - "scripts/e2e.sh"
  push:
    # Release tags only. No `paths:` filter — tag refs don't carry a
    # diff, so GitHub ignores the filter on tag events anyway.
    tags:
      - "*.*.*-alpha"
  workflow_dispatch:
  # Reusable: invoked by `.github/workflows/run-all.yml`.
  workflow_call:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Frontend (Playwright E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust: "false"

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E suite
        run: bash scripts/e2e.sh

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            /tmp/kokobrain-e2e-server.log
          retention-days: 7
