name: Privacy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/src/**"
      - "src-tauri/tauri.conf.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "PRIVACY.md"
      - ".github/workflows/privacy.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/src/**"
      - "src-tauri/tauri.conf.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "PRIVACY.md"
      - ".github/workflows/privacy.yml"
  workflow_dispatch:
  workflow_call:
concurrency:
  group: privacy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan-external-calls:
    name: Scan for External Calls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/scan-external-calls
        with:
          language-label: TypeScript/Svelte
          root: src
          include-globs: "*.ts,*.svelte,*.js"
          patterns: |
            fetch\s*\(
            XMLHttpRequest
            navigator\.sendBeacon
            WebSocket\s*\(
            EventSource\s*\(
            \.open\s*\(\s*["\x27](?:GET|POST|PUT|DELETE|PATCH)
            RTCPeerConnection
            navigator\.geolocation
            script\.src\s*=
            iframe\.src\s*=
            new\s+Image\s*\(.*\.src\s*=
            new\s+Worker\s*\(
            new\s+SharedWorker\s*\(
            ServiceWorker\.register
            import.*\b(axios|got|node-fetch|ky|superagent|undici|needle|request)\b
            require\s*\(\s*["\x27](axios|got|node-fetch|ky|superagent|undici|needle|request)["\x27]\)
            @doist/todoist-api-typescript
            @tauri-apps/plugin-http
            @sentry/browser
            https?://
          skip: |
            \.test\.ts
            \.spec\.ts
            node_modules
            \.svelte-kit/
            \.d\.ts:
            localhost
            127\.0\.0\.1
            tauri\.localhost
            e2e/
            privacy-ok
            :\s*//
            :\s*\*
            :\s*/\*
            w3\.org
            example\.com
          known: |
            cdn\.jsdelivr\.net/npm/chart\.js
            todoist\.com
            @doist/todoist-api-typescript
            @tauri-apps/plugin-http
            @sentry/browser
            ingest(\.us|\.de)?\.sentry\.io

      - uses: ./.github/actions/scan-external-calls
        with:
          language-label: Rust
          root: src-tauri/src
          include-globs: "*.rs"
          patterns: |
            reqwest
            hyper::client
            surf::
            ureq::
            curl::
            attohttpc
            isahc::
            minreq::
            awc::
            tonic::transport
            TcpStream::connect
            UdpSocket::connect
            https?://
          skip: |
            _test\.rs
            tests/
            target/
            localhost
            127\.0\.0\.1
            privacy-ok
            example\.com
            :\s*///
          known: |
            huggingface\.co/Xenova/bge-m3
            huggingface\.co/onnx-community/bge-reranker-v2-m3-ONNX
            github\.com/diegorv/koko\.brain/releases
