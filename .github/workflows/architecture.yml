name: Architecture Map

# Publishes the architecture map (scripts/architecture-map.mjs) and graphify's
# symbol graph (scripts/architecture-graphify.sh) to the `architecture` branch,
# which holds only that output. Nothing is committed to main; the curated docs
# are checked on PRs by src/tests/lib/architecture/architecture-map.test.ts.

on:
  push:
    branches: [main]
    paths:
      - "src/lib/**"
      - "src/routes/**"
      # Test counts and layer-rule debt on the pages come from here.
      - "src/tests/**"
      - "src-tauri/src/**"
      - "docs/architecture/**"
      - "scripts/architecture-*"
      - "scripts/import-graph.mjs"
      - "tsconfig.json"
      - "package.json"
      - ".github/workflows/architecture.yml"
  workflow_dispatch:

# One publish at a time; a queued run replaces an older queued one.
concurrency:
  group: architecture-map
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish to the architecture branch
    # A manual run from another branch would publish that branch's code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          mods-repo-read-token: ${{ secrets.MODS_REPO_READ_TOKEN }}
          rust: "false"

      - name: Install graphify (pinned, hash-checked)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/graphify-venv"
          "$RUNNER_TEMP/graphify-venv/bin/pip" install --require-hashes --no-deps --only-binary :all: \
            -r scripts/architecture-graphify.requirements.txt
          echo "$RUNNER_TEMP/graphify-venv/bin" >> "$GITHUB_PATH"

      - name: Check out the architecture branch
        run: |
          set -euo pipefail
          MAP="$RUNNER_TEMP/architecture"
          echo "MAP=$MAP" >> "$GITHUB_ENV"
          if git fetch --depth 1 origin architecture; then
            git worktree add -B architecture "$MAP" FETCH_HEAD
          else
            git worktree add --orphan -b architecture "$MAP"
          fi

      # Code links point at main, not at this commit, so a push that changes
      # one module does not rewrite the links of every page. The index names
      # the source commit.
      - name: Generate the map and the graph
        run: |
          set -euo pipefail
          node scripts/architecture-map.mjs --out "$MAP" --graphify \
            --link-base "${{ github.server_url }}/${{ github.repository }}/blob/main" \
            --source "${{ github.sha }}"
          bash scripts/architecture-graphify.sh "$MAP"

      - name: Commit and push
        working-directory: ${{ runner.temp }}/architecture
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Architecture map unchanged."
          else
            git commit -m "docs: architecture map for ${GITHUB_SHA::9}"
            git push origin architecture
          fi
