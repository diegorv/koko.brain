name: CI

permissions:
  contents: read

# Triggers:
#   - workflow_dispatch: manual revalidation lever.
#   - workflow_call: invoked by pr.yml (the pull_request gate — the PR
#     entry point lives there now, aggregating this workflow with e2e +
#     security into one required `PR success` check), nightly.yml (every
#     push to main), release.yml (tag push, with force_all:true), and
#     run-all.yml (manual full sweep).
#
# `pull_request` is intentionally NOT a trigger here anymore. pr.yml owns
# the PR event and calls this workflow via workflow_call; a direct
# pull_request trigger would double-run CI on every PR.
#
# `push: main` is intentionally NOT a trigger here. Every accepted
# commit to main is already validated through nightly.yml, which calls
# this workflow via `workflow_call`. A standalone push trigger would
# duplicate that invocation: both runs would land in the same
# `ci-refs/heads/main` concurrency group, cancel-in-progress would
# kill one of them mid-run (see run 25831097465, killed with
# "higher priority waiting request for ci-refs/heads/main"), and the
# history would carry a confusing trail of cancelled runs that look
# like flakes but are just self-collisions. Tag pushes are unaffected
# because release.yml owns the tag path end-to-end.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      force_all:
        description: "Bypass the paths filter and run frontend + rust unconditionally"
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      # When `force_all` is true (release.yml on a tag push), short-circuit
      # the paths-filter step entirely and pretend everything changed.
      # Otherwise pass through the paths-filter outputs as before.
      frontend: ${{ inputs.force_all == true && 'true' || steps.filter.outputs.frontend }}
      rust: ${{ inputs.force_all == true && 'true' || steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7.0.0

      # Pinned by commit SHA, not tag, so a compromised maintainer
      # account can't move the version tag to malicious code and have
      # us pick it up silently. Dependabot still updates this entry
      # (it reads the trailing `# v4.0.1` tag comment).
      # Skipped on release runs (`force_all: true`) — the outputs are
      # forced to `true` regardless, so running the filter would just
      # waste seconds.
      - if: ${{ inputs.force_all != true }}
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            frontend:
              - "src/**"
              - "static/**"
              - "pnpm-lock.yaml"
              - "package.json"
              - "tsconfig.json"
              - "svelte.config.*"
              - "vite.config.*"
              - "tailwind.config.*"
              - "postcss.config.*"
              - "components.json"
              # CI infrastructure changes (composite actions, workflow
              # definitions) can break the frontend pipeline silently —
              # e.g. a setup-action change that drops pnpm caching, or a
              # workflow tweak that mis-orders the install step. Re-run
              # frontend tests when these change so regressions surface
              # in the same PR rather than in the next product commit.
              - ".github/actions/**"
              - ".github/workflows/**"
            rust:
              - "src-tauri/**"
              # Same rationale as frontend: setup-action and workflow
              # changes can break the Rust toolchain setup (see commits
              # ce864fdb / fd02d64f, where a runner image regression
              # required iterating the composite setup). Trigger the
              # Rust job on CI infra changes so the fix is validated
              # in the same PR.
              - ".github/actions/**"
              - ".github/workflows/**"

  frontend:
    name: Frontend (typecheck + tests)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust: "false"

      # `pnpm check` runs `svelte-kit sync` first, so it already produces the
      # generated files vitest needs — no separate sync step required.
      - name: Run type check
        run: pnpm check

      - name: Run unit tests
        run: pnpm vitest run

      # Verifies the SvelteKit / Vite production bundle actually compiles.
      # `pnpm check` covers types and `pnpm vitest run` covers logic, but
      # neither catches runtime-only bundling failures (SSR-incompatible
      # imports, dynamic import paths that don't resolve, type-only
      # re-exports that become runtime errors, asset references missing
      # at build time). Without this step, those regressions only surface
      # inside `tauri-action` during release — late and expensive.
      - name: Build frontend bundle
        run: pnpm build

  rust:
    name: Rust (cargo test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Linux for the main suite: cheaper minutes, faster queue. After
    # the encrypted-notes removal (commit b562224) the only remaining
    # `#[cfg(target_os = "macos")]` surface is `src/commands/fonts.rs`
    # (CoreText FFI), which has a `#[cfg(not(target_os = "macos"))]`
    # fallback returning `Ok(vec![])` so the crate compiles on Linux.
    # The macOS-only tests at `tests/commands/fonts_test.rs` are wholly
    # gated and excluded from this run; the `rust-fonts-macos` job below
    # picks them up on macos-latest so CoreText behavior is still
    # validated on every PR touching `src-tauri/**`.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.0

      # Tauri 2 pulls in `glib-sys`, `gtk-sys`, `webkit2gtk-sys`, etc. via
      # the `tauri` crate's Linux backend. Even `cargo test` (which never
      # links a final binary) still runs each `-sys` crate's build script,
      # and those scripts shell out to `pkg-config glib-2.0 / gtk+-3.0 /
      # webkit2gtk-4.1` and abort the build when the system libraries are
      # absent. The ubuntu-latest image ships none of them, so without
      # this step the job dies at the very first `glib-sys` build script
      # (see CI run 26097329567, job 76738532621: "Package 'glib-2.0',
      # required by 'virtual:world', not found").
      #
      # Package list mirrors the Tauri 2 Linux prerequisites documented
      # at https://v2.tauri.app/start/prerequisites/#linux for
      # Debian/Ubuntu 24.04.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libsoup-3.0-dev \
            build-essential \
            pkg-config

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          # The setup action defaults `rust-targets` to
          # `aarch64-apple-darwin` for the release/nightly macOS builds.
          # On a Linux runner we only need the host toolchain — passing
          # an empty value skips the cross-target install that rustup
          # would otherwise do unnecessarily.
          rust-targets: ""

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-fonts-macos:
    name: Rust (cargo test — macOS fonts)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # `src/commands/fonts.rs` uses CoreText FFI and its tests
    # (`tests/commands/fonts_test.rs`) are gated on
    # `#[cfg(target_os = "macos")]`. They would silently vanish from
    # the Linux `rust` job above — running them here keeps CoreText
    # behavior (sorting, UTF-8 encoding, "Helvetica is present")
    # covered on every PR touching `src-tauri/**`. Filtering to
    # `--test commands_test commands::fonts_test::macos` compiles only
    # the `commands_test` integration binary and the library; every
    # other integration test (db_*, search_*, semantic_*, vault_*, …)
    # is skipped, so this job is dramatically cheaper than the
    # previous full macOS-only suite.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Run fonts tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --test commands_test commands::fonts_test::macos

  # Aggregate gate used as the single required status check for branch
  # protection. `frontend` and `rust` are skipped when their paths
  # filter says nothing relevant changed, which makes them unusable as
  # required checks directly (a "rust-only" PR would have `frontend`
  # skipped, branch protection would block forever). This sentinel
  # passes when every dependency either succeeded or was deliberately
  # skipped, and fails on any real failure or cancellation.
  ci-success:
    name: CI success
    needs: [changes, frontend, rust, rust-fonts-macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Aggregate gate results
        run: |
          set -euo pipefail
          changes="${{ needs.changes.result }}"
          frontend="${{ needs.frontend.result }}"
          rust="${{ needs.rust.result }}"
          rust_fonts_macos="${{ needs.rust-fonts-macos.result }}"
          echo "changes=$changes frontend=$frontend rust=$rust rust_fonts_macos=$rust_fonts_macos"
          if [ "$changes" != "success" ]; then
            echo "::error::changes job did not succeed (result=$changes)"
            exit 1
          fi
          for name in frontend rust rust-fonts-macos; do
            case "$name" in
              frontend) result="$frontend" ;;
              rust) result="$rust" ;;
              rust-fonts-macos) result="$rust_fonts_macos" ;;
            esac
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::$name job did not pass (result=$result)"
              exit 1
            fi
          done
          echo "All gates passed."

