name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      force_all:
        description: "Bypass the paths filter and run frontend + rust unconditionally"
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      frontend: ${{ inputs.force_all == true && 'true' || steps.filter.outputs.frontend }}
      rust: ${{ inputs.force_all == true && 'true' || steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7.0.1

      - if: ${{ inputs.force_all != true }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - "src/**"
              - "static/**"
              - "pnpm-lock.yaml"
              - "package.json"
              - "tsconfig.json"
              - "vite.config.*"
              - "tailwind.config.*"
              - "postcss.config.*"
              - "components.json"
              - ".github/actions/**"
              - ".github/workflows/**"
            rust:
              - "src-tauri/**"
              - ".github/actions/**"
              - ".github/workflows/**"

  frontend:
    name: Frontend (typecheck + tests)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust: "false"

      - name: Run type check
        run: pnpm check

      - name: Run unit tests
        run: pnpm vitest run

      - name: Build frontend bundle
        run: pnpm build

  rust:
    name: Rust (cargo test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libsoup-3.0-dev \
            build-essential \
            pkg-config

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust-targets: ""

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-fonts-macos:
    name: Rust (cargo test — macOS fonts)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup

      # One cargo call per target: a filter applies to every target of a call.
      # A filter that matches nothing still exits 0, so each call must report
      # a non-zero passed count.
      - name: Run macOS-gated tests
        run: |
          set -euo pipefail
          run_nonzero() {
            log=$(mktemp)
            cargo test --manifest-path src-tauri/Cargo.toml -p kokobrain "$@" 2>&1 | tee "$log"
            passed=$({ grep -Eo 'test result: ok\. [0-9]+ passed' "$log" || true; } | awk '{ s += $4 } END { print s + 0 }')
            if [ "$passed" -eq 0 ]; then
              echo "::error::cargo test $* ran 0 tests"
              exit 1
            fi
            echo "cargo test $*: $passed passed"
          }
          run_nonzero --lib commands::fonts
          run_nonzero --test semantic_qos_test
          run_nonzero --test utils_fs_test
          run_nonzero --test semantic_embedder_qos_session_test

  secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # The action defaults to 8.24.3, which silently ignores `[[allowlists]]`.
          GITLEAKS_VERSION: "8.30.1"

  ci-success:
    name: CI success
    needs: [changes, frontend, rust, rust-fonts-macos, secrets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Aggregate gate results
        run: |
          set -euo pipefail
          changes="${{ needs.changes.result }}"
          frontend="${{ needs.frontend.result }}"
          rust="${{ needs.rust.result }}"
          rust_fonts_macos="${{ needs.rust-fonts-macos.result }}"
          secrets_scan="${{ needs.secrets.result }}"
          echo "changes=$changes frontend=$frontend rust=$rust rust_fonts_macos=$rust_fonts_macos secrets=$secrets_scan"
          if [ "$changes" != "success" ]; then
            echo "::error::changes job did not succeed (result=$changes)"
            exit 1
          fi
          for name in frontend rust rust-fonts-macos secrets; do
            case "$name" in
              frontend) result="$frontend" ;;
              rust) result="$rust" ;;
              rust-fonts-macos) result="$rust_fonts_macos" ;;
              secrets) result="$secrets_scan" ;;
            esac
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::$name job did not pass (result=$result)"
              exit 1
            fi
          done
          echo "All gates passed."

