name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      MODS_REPO_READ_TOKEN:
        description: "Read-only access to diegorv/koko.brain-mods"
        required: true
    inputs:
      force_all:
        description: "Bypass the paths filter and run frontend + rust unconditionally"
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      frontend: ${{ inputs.force_all == true && 'true' || steps.filter.outputs.frontend }}
      rust: ${{ inputs.force_all == true && 'true' || steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7.0.1

      - if: ${{ inputs.force_all != true }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - "src/**"
              - "e2e/**"
              - "static/**"
              - "pnpm-lock.yaml"
              - "package.json"
              - "tsconfig.json"
              - "vite.config.*"
              - "tailwind.config.*"
              - "postcss.config.*"
              - "components.json"
              - ".github/actions/setup/**"
              - ".github/workflows/ci.yml"
            rust:
              - "src-tauri/**"
              - "src/lib/contracts/generated/**"
              # vault_file_ops_test ties MOD_DATA_DIR to the Rust mod data commands
              - "src/lib/plugins/mods/mods.logic.ts"
              - ".cargo/**"
              - ".github/actions/setup/**"
              - ".github/workflows/ci.yml"

  frontend:
    name: Frontend (typecheck + tests)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          mods-repo-read-token: ${{ secrets.MODS_REPO_READ_TOKEN }}
          rust: "false"

      - name: Run type check
        run: pnpm check

      - name: Run unit tests
        run: pnpm vitest run

      - name: Build frontend bundle
        run: pnpm build

  rust:
    name: Rust (cargo test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Ubuntu mirror fallback
        uses: ./.github/actions/ubuntu-mirror-fallback

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libsoup-3.0-dev \
            build-essential \
            pkg-config

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          mods-repo-read-token: ${{ secrets.MODS_REPO_READ_TOKEN }}
          rust-targets: ""

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      # The `#[ts(export)]` tests rewrite src/lib/contracts/generated/ from
      # the Rust types. Deleting it first makes a binding for a removed type
      # show up as a deletion too.
      - name: Run tests (regenerates TS bindings)
        run: |
          rm -rf src/lib/contracts/generated
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check TS bindings are committed
        run: |
          stale=$(git status --porcelain -- src/lib/contracts/generated)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::src/lib/contracts/generated is stale: run cargo test from the repo root and commit the result"
            exit 1
          fi

  rust-fonts-macos:
    name: Rust (cargo test — macOS fonts)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          mods-repo-read-token: ${{ secrets.MODS_REPO_READ_TOKEN }}

      # The rust job lints on Linux, where macOS-gated code is compiled out.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      # One cargo call per target: a filter applies to every target of a call.
      # A filter that matches nothing still exits 0, so every binary of a call
      # must report a non-zero passed count. `run_tests N` also requires the
      # call's total to be exactly N; `any` skips that check.
      # The semantic_qos_test names are its #[cfg(target_os = "macos")] tests:
      # add or rename one there and update the list and count here too.
      - name: Run macOS-gated tests
        run: |
          set -euo pipefail
          run_tests() {
            expected=$1
            shift
            case $expected in
              any) ;;
              '' | *[!0-9]*)
                echo "::error::run_tests: bad count '$expected'"
                exit 1
                ;;
            esac
            log=$(mktemp)
            cargo test --manifest-path src-tauri/Cargo.toml -p kokobrain "$@" 2>&1 | tee "$log"
            counts=$({ grep -Eo 'test result: ok\. [0-9]+ passed' "$log" || true; } | awk '{ print $4 }')
            if [ -z "$counts" ] || ! awk '$1 == 0 { exit 1 }' <<<"$counts"; then
              echo "::error::cargo test $* ran 0 tests in a binary"
              exit 1
            fi
            passed=$(awk '{ s += $1 } END { print s }' <<<"$counts")
            if [ "$expected" != any ] && [ "$passed" -ne "$expected" ]; then
              echo "::error::cargo test $* ran $passed tests, expected $expected"
              exit 1
            fi
            echo "cargo test $*: $passed passed"
          }
          run_tests any --lib commands::fonts
          run_tests any --test semantic_qos_test
          run_tests 3 --test semantic_qos_test -- --exact \
            guard_lowers_the_thread_to_utility_and_restores_it \
            nested_guards_restore_in_order \
            thread_manager_starts_workers_at_utility
          run_tests any --test utils_fs_test
          run_tests any --test semantic_embedder_qos_session_test

  ci-success:
    name: CI success
    needs: [changes, frontend, rust, rust-fonts-macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Aggregate gate results
        run: |
          set -euo pipefail
          changes="${{ needs.changes.result }}"
          frontend="${{ needs.frontend.result }}"
          rust="${{ needs.rust.result }}"
          rust_fonts_macos="${{ needs.rust-fonts-macos.result }}"
          echo "changes=$changes frontend=$frontend rust=$rust rust_fonts_macos=$rust_fonts_macos"
          if [ "$changes" != "success" ]; then
            echo "::error::changes job did not succeed (result=$changes)"
            exit 1
          fi
          for name in frontend rust rust-fonts-macos; do
            case "$name" in
              frontend) result="$frontend" ;;
              rust) result="$rust" ;;
              rust-fonts-macos) result="$rust_fonts_macos" ;;
            esac
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::$name job did not pass (result=$result)"
              exit 1
            fi
          done
          echo "All gates passed."

