name: Secret Scan

permissions:
  contents: read

# Every push and PR, docs-only ones included: a secret pasted into a .md or a
# .scratch note leaks as easily as one in code.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

# One run per sha, never cancelled: gitleaks scans the pushed commits, so a
# cancelled run leaves that range unscanned. github.workflow is the caller's
# name under workflow_call, so a release run does not share the push's group.
concurrency:
  group: secrets-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # The action defaults to 8.24.3, which silently ignores `[[allowlists]]`.
          GITLEAKS_VERSION: "8.30.1"

  # On a tag push gitleaks-action finds an empty commit list and exits with
  # "No commits to scan", so a release (release.yml, via workflow_call) scans
  # the commits since the previous release tag with the CLI instead.
  gitleaks-release:
    name: Secret Scan (gitleaks, since previous release)
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "v${GITLEAKS_VERSION}" -R gitleaks/gitleaks \
            -p "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -p "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the commits since the previous release tag
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' "${GITHUB_SHA}^" 2>/dev/null || true)
          range="${prev:+${prev}..}${GITHUB_SHA}"
          echo "Scanning ${range}"
          gitleaks git . --config .gitleaks.toml --log-opts="${range}" --redact --verbose
