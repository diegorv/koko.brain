name: Code Map

# Regenerates codemap/ (scripts/codemap.mjs) from the tip of main and commits
# it when the output changed. Branches never write codemap/: the generator
# refuses an in-place write off main unless CI=true. A push made with
# GITHUB_TOKEN starts no workflow, so the bot commit does not run this again.

on:
  push:
    branches: [main]
    paths:
      - "src/lib/**"
      - "src/routes/**"
      - "src/tests/**"
      - "e2e/**"
      - "src-tauri/src/**"
      - "src-tauri/tests/**"
      - "src-tauri/examples/**"
      - "scripts/codemap.mjs"
      - "scripts/codemap/**"
      - "scripts/import-graph.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/codemap.yml"
  workflow_dispatch:

# A burst of pushes leaves at most one pending run, which builds from the tip.
concurrency:
  group: codemap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate codemap/
    # A manual run from another branch would map that branch's code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          mods-repo-read-token: ${{ secrets.MODS_REPO_READ_TOKEN }}
          rust: "false"

      # Each attempt builds from the current tip of main (never a rebase). A
      # rejected push means main moved: fetch it and build again.
      - name: Regenerate, commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --depth 1 origin main
            git reset --hard FETCH_HEAD
            # Installed node_modules match this run's lockfile only; the push
            # that changed it runs its own job.
            if ! git diff --quiet "$GITHUB_SHA" HEAD -- pnpm-lock.yaml; then
              echo "pnpm-lock.yaml changed since $GITHUB_SHA; the newer run regenerates the map."
              exit 0
            fi
            node scripts/codemap.mjs
            git add -A codemap
            if git diff --cached --quiet; then
              echo "codemap unchanged"
              exit 0
            fi
            hash=$(sed -n 's/.*inputs=sha256:\([0-9a-f]\{12\}\).*/\1/p' codemap/INDEX.md | head -n 1)
            git commit -m "chore(codemap): regenerate for $(git rev-parse --short=9 HEAD)" \
              -m "Inputs hash ${hash}. Generated by scripts/codemap.mjs; no hand edits."
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; retrying from the new tip of main."
          done
          echo "Push rejected 3 times." >&2
          exit 1
