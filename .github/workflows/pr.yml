name: PR

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".scratch/**"
      - "help/**"
      - "LICENSE"

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
      security: ${{ steps.filter.outputs.security }}
      privacy: ${{ steps.filter.outputs.privacy }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            e2e:
              - "src/**"
              - "static/**"
              - "e2e/**"
              - "pnpm-lock.yaml"
              - "package.json"
              - "tsconfig.json"
              - "svelte.config.*"
              - "vite.config.*"
              - "tailwind.config.*"
              - "postcss.config.*"
              - "components.json"
              - "scripts/e2e.sh"
              - ".github/actions/**"
              - ".github/workflows/**"
            security:
              - "pnpm-lock.yaml"
              - "package.json"
              - "pnpm-workspace.yaml"
              - "src-tauri/Cargo.toml"
              - "src-tauri/Cargo.lock"
              - "scripts/quarantine-aware-audit.mjs"
              - ".github/actions/**"
              - ".github/workflows/**"
            privacy:
              - "src/**"
              - "src-tauri/src/**"
              - "src-tauri/tauri.conf.json"
              - "package.json"
              - "pnpm-lock.yaml"
              - ".github/actions/scan-external-calls/**"
              - ".github/workflows/privacy.yml"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yml

  security:
    name: Security
    needs: changes
    if: needs.changes.outputs.security == 'true'
    # Union of every permission security.yml requests: GitHub validates them
    # before evaluating any job `if`, so a missing one fails the whole call.
    permissions:
      contents: read
      checks: write
      actions: read
      security-events: write
    uses: ./.github/workflows/security.yml

  privacy:
    name: Privacy
    needs: changes
    if: needs.changes.outputs.privacy == 'true'
    uses: ./.github/workflows/privacy.yml

  pr-success:
    name: PR success
    needs: [changes, ci, e2e, security, privacy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Aggregate gate results
        run: |
          set -euo pipefail
          changes="${{ needs.changes.result }}"
          ci="${{ needs.ci.result }}"
          e2e="${{ needs.e2e.result }}"
          security="${{ needs.security.result }}"
          privacy="${{ needs.privacy.result }}"
          echo "changes=$changes ci=$ci e2e=$e2e security=$security privacy=$privacy"
          if [ "$changes" != "success" ]; then
            echo "::error::changes job did not succeed (result=$changes)"
            exit 1
          fi
          if [ "$ci" != "success" ]; then
            echo "::error::ci did not pass (result=$ci)"
            exit 1
          fi
          for pair in "e2e:$e2e" "security:$security" "privacy:$privacy"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::$name job did not pass (result=$result)"
              exit 1
            fi
          done
          echo "All PR gates passed."
