name: Release

on:
  push:
    tags:
      - "*.*.*-alpha"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag is on main branch
        run: |
          set -euo pipefail
          TAG_COMMIT=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Release tag ${{ github.ref_name }} is not on the main branch. Aborting."
            exit 1
          fi
          echo "Validated: ${{ github.ref_name }} is on main branch"

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The previous "Validate tag is on main branch" step guarantees the
          # tagged commit is on `main`. CI (ci.yml) runs on every push to
          # `main`, so a CI run for this SHA must EITHER already exist
          # (commit pushed earlier, CI completed) OR be about to start
          # (commit + tag pushed together via `git push --follow-tags`).
          #
          # Both flows are valid. We don't want to force the user through
          # a PR before every release — sometimes you bump version locally,
          # commit, tag, and push everything at once. So this step:
          #
          #   1. Waits up to 5 min for a CI run to appear on this SHA
          #      (handles the race where Release fires before CI is
          #      registered by GitHub).
          #   2. Uses `gh run watch --exit-status` to poll the run until
          #      it completes, then propagates its exit code as ours.
          #
          # If CI fails or is cancelled, this step fails and Release
          # aborts before building / signing / publishing anything.

          SHA="${GITHUB_SHA}"

          echo "Waiting for a CI run to appear for commit ${SHA}..."
          RUN_ID=""
          for i in $(seq 1 30); do
            RUN_ID=$(gh run list \
              --workflow=ci.yml \
              --commit "$SHA" \
              --json databaseId \
              --jq '.[0].databaseId // ""' \
              2>/dev/null || true)
            if [ -n "$RUN_ID" ]; then
              echo "Found CI run #${RUN_ID} after $((i * 10))s"
              break
            fi
            echo "  ($i/30) no CI run yet, sleeping 10s..."
            sleep 10
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::No CI run appeared for commit ${SHA} after 5 minutes."
            echo "::error::CI's path filter may have skipped this commit (only docs / workflow file changes?)."
            echo "::error::Either push a real code change or re-run this release via workflow_dispatch."
            exit 1
          fi

          echo ""
          echo "Watching CI run #${RUN_ID} until it completes..."
          gh run watch "$RUN_ID" --exit-status

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          # Find the previous tag
          PREV_TAG=$(git tag --list --sort=-version:refname | grep -v "^${TAG}$" | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            # First release — use all commits
            COMMITS=$(git log --pretty=format:"- %s (%h)" "$TAG" | grep -v "^- chore: bump version")
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${TAG}" | grep -v "^- chore: bump version")
          fi
          # Store in output (handle multiline)
          {
            echo "commits<<CHANGELOG_EOF"
            echo "$COMMITS"
            echo "CHANGELOG_EOF"
            echo "prev_tag=${PREV_TAG:-}"
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=4096"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          args: '--target aarch64-apple-darwin'
          releaseBody: |
            ## What's Changed

            ${{ steps.changelog.outputs.commits }}

            ${{ steps.changelog.outputs.prev_tag && format('**Full diff:** [{0}...{1}](https://github.com/{2}/compare/{0}...{1})', steps.changelog.outputs.prev_tag, github.ref_name, github.repository) || '' }}

            ## Verify download integrity

            After downloading, verify the SHA-256 checksum against the `checksums-sha256.txt` file:

            ```bash
            shasum -a 256 <downloaded-file>
            ```

            Compare the output with the corresponding entry in `checksums-sha256.txt`.
          releaseDraft: false
          prerelease: false

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          cd src-tauri/target/aarch64-apple-darwin/release/bundle
          CHECKSUM_FILE="checksums-sha256.txt"
          find . -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \) | sort | sed 's|^\./||' | while read -r file; do
            shasum -a 256 "$file" >> "$CHECKSUM_FILE"
          done
          echo "--- Checksums ---"
          cat "$CHECKSUM_FILE"

      - name: Upload checksums to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" \
            src-tauri/target/aarch64-apple-darwin/release/bundle/checksums-sha256.txt \
            --clobber
