name: Release

on:
  push:
    tags:
      - "*.*.*"
      - "*.*.*-*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag matches an accepted release channel
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          channel_re='^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc\.[0-9]+))?$'
          if ! [[ "$TAG" =~ $channel_re ]]; then
            echo "::error::Tag '$TAG' does not match an accepted release channel pattern."
            echo "::error::Accepted: X.Y.Z (stable), X.Y.Z-alpha, X.Y.Z-beta, X.Y.Z-rc.N"
            exit 1
          fi
          echo "Tag '$TAG' matches accepted channel pattern."

      - name: Validate tag is on main branch
        run: |
          set -euo pipefail
          TAG_COMMIT=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Release tag ${{ github.ref_name }} is not on the main branch. Aborting."
            exit 1
          fi
          echo "Validated: ${{ github.ref_name }} is on main branch"

  ci:
    name: CI
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      force_all: true

  e2e:
    name: E2E
    needs: validate
    uses: ./.github/workflows/e2e.yml

  security:
    name: Security
    needs: validate
    uses: ./.github/workflows/security.yml

  build-macos:
    name: Build macOS
    needs: [ci, e2e]
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust-cache-key: macos-release-aarch64

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | grep -v "^${TAG}$" | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            RANGE="$TAG"
          else
            RANGE="${PREV_TAG}..${TAG}"
          fi
          COMMITS=$(git log --pretty=format:"- %s (%h)" "$RANGE" | grep -v "^- chore: bump version" || true)
          {
            echo "commits<<CHANGELOG_EOF"
            echo "$COMMITS"
            echo "CHANGELOG_EOF"
            echo "prev_tag=${PREV_TAG:-}"
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=4096"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          # A contents:write token can only create a release at the current head.
          releaseCommitish: main
          args: '--target aarch64-apple-darwin'
          releaseBody: |
            ## What's Changed

            ${{ steps.changelog.outputs.commits }}

            ${{ steps.changelog.outputs.prev_tag && format('**Full diff:** [{0}...{1}](https://github.com/{2}/compare/{0}...{1})', steps.changelog.outputs.prev_tag, github.ref_name, github.repository) || '' }}

            ## Documentation

            Download the help vault with documentation and examples: [`kokobrain-help-${{ github.ref_name }}.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/kokobrain-help-${{ github.ref_name }}.tar.gz)

            ## Verify download integrity

            ```bash
            shasum -a 256 <downloaded-file>
            ```

            Compare the output with the matching entry in the checksums block
            appended below (also uploaded as `checksums-sha256.txt`).
          releaseDraft: false
          prerelease: false

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          cd src-tauri/target/aarch64-apple-darwin/release/bundle
          CHECKSUM_FILE="checksums-sha256.txt"
          find . -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \) | sort | while read -r file; do
            shasum -a 256 "$file" | awk -v n="$(basename "$file")" '{print $1 "  " n}' >> "$CHECKSUM_FILE"
          done
          echo "--- Checksums ---"
          cat "$CHECKSUM_FILE"

      - name: Upload checksums to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" \
            src-tauri/target/aarch64-apple-darwin/release/bundle/checksums-sha256.txt \
            --clobber

      - name: Publish checksums in the release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          gh release view "$TAG" --json body --jq .body > body.md
          sed -i '' '/^## Checksums (SHA256)$/,$d' body.md
          {
            echo "## Checksums (SHA256)"
            echo '```'
            cat src-tauri/target/aarch64-apple-darwin/release/bundle/checksums-sha256.txt
            echo '```'
          } >> body.md
          gh release edit "$TAG" --notes-file body.md

      - name: Package help documentation
        run: |
          set -euo pipefail
          tar czf "kokobrain-help-${{ github.ref_name }}.tar.gz" \
            --exclude='.DS_Store' \
            -C help .

      - name: Upload help documentation to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" \
            "kokobrain-help-${{ github.ref_name }}.tar.gz" \
            --clobber
