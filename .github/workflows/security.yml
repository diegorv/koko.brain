name: Security

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9:00 UTC
  workflow_dispatch:
  # Reusable: invoked by `.github/workflows/run-all.yml`.
  workflow_call:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust: "false"

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level permissions REPLACE workflow-level (they're not merged),
    # so the `contents: read` baseline has to be redeclared alongside
    # the `checks: write` escalation required by `rustsec/audit-check`.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6

      - name: Audit dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  supply-chain-quarantine:
    name: Supply Chain Quarantine
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v6

      - name: Verify pnpm-workspace.yaml exists
        run: |
          if [[ ! -f pnpm-workspace.yaml ]]; then
            echo "::error::pnpm-workspace.yaml is missing — supply chain quarantine is disabled!"
            exit 1
          fi

      - name: Verify minimumReleaseAge is configured
        run: |
          age=$(grep -oP 'minimumReleaseAge:\s*\K\d+' pnpm-workspace.yaml || true)
          if [[ -z "$age" ]]; then
            echo "::error::minimumReleaseAge is not set in pnpm-workspace.yaml"
            exit 1
          fi
          min_age=10080  # 7 days in minutes
          if [[ "$age" -lt "$min_age" ]]; then
            echo "::error::minimumReleaseAge is $age minutes ($(( age / 1440 )) days), minimum required is $min_age minutes (7 days)"
            exit 1
          fi
          echo "✅ minimumReleaseAge is $age minutes ($(( age / 1440 )) days)"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
