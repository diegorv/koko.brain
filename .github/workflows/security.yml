name: Security

permissions:
  contents: read

on:
  push:
    # Solo project: commits land directly on main, so the full security
    # suite runs on every push (Actions is free on this public repo). This
    # is the primary trigger; dispatch / cron are secondary. The
    # pull_request path is owned by pr.yml, which calls this workflow via
    # workflow_call (change-gated on dependency files) so a direct
    # pull_request trigger here would double-run the audits on every PR.
    branches: [main]
    paths-ignore:
      - "**/*.md"
  schedule:
    # Daily full-tree OSV scan (12:30 UTC). Catches advisories disclosed
    # for unchanged dependencies on days with no push.
    - cron: "30 12 * * *"
  workflow_dispatch:
  # Reusable: invoked by `.github/workflows/pr.yml` (the pull_request
  # gate), `.github/workflows/release.yml`, and
  # `.github/workflows/run-all.yml`.
  workflow_call:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust: "false"

      - name: Audit dependencies (quarantine-aware)
        # `pnpm audit` exits non-zero on any moderate-or-higher advisory,
        # which conflicts with our own 7-day supply-chain quarantine
        # (`minimumReleaseAge` in pnpm-workspace.yaml). When upstream ships
        # a security patch there is a window where the advisory is public
        # but the patch is still inside the quarantine — we *cannot*
        # install it and we shouldn't fail CI for it. The script downgrades
        # those advisories to `::warning::` and only fails the job when at
        # least one patched version is already outside the quarantine
        # window (i.e. we should have updated and didn't). See
        # `scripts/quarantine-aware-audit.mjs` for the full classification.
        run: node scripts/quarantine-aware-audit.mjs

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level permissions REPLACE workflow-level (they're not merged),
    # so the `contents: read` baseline has to be redeclared alongside
    # the `checks: write` escalation required by `rustsec/audit-check`.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Audit dependencies
        # Pinned by commit SHA, not tag — same supply-chain reasoning
        # as the other third-party actions. Dependabot bumps via the
        # trailing `# v2.0.0` tag comment.
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # Accepted advisories (see src-tauri/.cargo/audit.toml for the
          # full rationale, which also covers local `cargo audit` runs —
          # this action does NOT read that config file, so the list is
          # mirrored here).
          # RUSTSEC-2024-0429: glib 0.18.5 `VariantStrIter` unsoundness
          # (NULL deref in optimized builds), reachable only through the
          # Linux-only GTK stack (tauri -> gtk 0.18 -> atk -> glib), never
          # compiled for the shipped macOS target; fixed in glib 0.19,
          # which gtk-rs 0.18 pins out. Drop when tauri moves off gtk 0.18.
          ignore: RUSTSEC-2024-0429

  supply-chain-quarantine:
    name: Supply Chain Quarantine
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify pnpm-workspace.yaml exists
        run: |
          if [[ ! -f pnpm-workspace.yaml ]]; then
            echo "::error::pnpm-workspace.yaml is missing — supply chain quarantine is disabled!"
            exit 1
          fi

      - name: Verify minimumReleaseAge is configured
        run: |
          age=$(grep -oP 'minimumReleaseAge:\s*\K\d+' pnpm-workspace.yaml || true)
          if [[ -z "$age" ]]; then
            echo "::error::minimumReleaseAge is not set in pnpm-workspace.yaml"
            exit 1
          fi
          min_age=10080  # 7 days in minutes
          if [[ "$age" -lt "$min_age" ]]; then
            echo "::error::minimumReleaseAge is $age minutes ($(( age / 1440 )) days), minimum required is $min_age minutes (7 days)"
            exit 1
          fi
          echo "✅ minimumReleaseAge is $age minutes ($(( age / 1440 )) days)"

  gitleaks-history:
    name: Secret Scan (full history)
    # The differential scan lives in ci.yml and covers every PR / push
    # commit range. This one re-scans the COMPLETE reachable history, which
    # is what catches a credential committed months ago and never rotated,
    # or a rule added to .gitleaks.toml after the fact.
    #
    # Same `github.workflow == 'Security'` guard as osv-scanner below: under
    # `workflow_call` from pr.yml / release.yml / run-all.yml, `event_name`
    # reports the CALLER's event, so without this guard a full-history scan
    # would piggyback on every PR that touches a dependency file. Restricted
    # further to the cron and manual dispatch — a push to main is already
    # covered differentially.
    if: >-
      github.workflow == 'Security' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicit rather than relying on gitleaks' root auto-discovery:
          # a config silently ignored means a red run on a known-good
          # allowlisted finding.
          GITLEAKS_CONFIG: .gitleaks.toml
          # gitleaks-action v3.0.0 hardcodes `GITLEAKS_VERSION || "8.24.3"`
          # (src/index.js:138), and 8.24.3 predates the top-level plural
          # `[[allowlists]]` table — that landed in 8.25.0. Viper is not
          # configured with ErrorUnused, so 8.24.3 drops the unknown key
          # SILENTLY: no error, no warning, the allowlist simply does not
          # apply. Verified locally against this repo's history: 8.24.3 with
          # .gitleaks.toml reports 1 leak (the allowlisted encrypted-notes
          # fixture), 8.30.1 with the same file reports 0. Pinning here also
          # keeps CI on the exact version used to validate the config.
          GITLEAKS_VERSION: "8.30.1"

  osv-scanner:
    name: OSV Scanner (full tree)
    # Full-tree OSV scan (pnpm lockfile + Cargo.lock) -> Security tab. Unified
    # dashboard on top of npm-audit (GHSA) and cargo-audit (RustSec). Report-only
    # (`fail-on-vuln: false`) — never fails the build, same stance as npm-audit.
    #
    # `github.workflow == 'Security'` = run only when this workflow fires on its
    # own triggers (push / PR / cron / dispatch). Skips the workflow_call
    # invocations from release.yml / run-all.yml, where the caller narrows the
    # token and the SARIF upload would fail.
    if: github.workflow == 'Security'
    # Job-level permissions REPLACE workflow-level (they're not merged), so the
    # `contents: read` baseline is redeclared alongside the escalations the
    # reusable workflow needs to push SARIF to the Security tab.
    permissions:
      actions: read
      contents: read
      security-events: write
    # Pinned by commit SHA, not tag — same supply-chain reasoning as the other
    # third-party actions. Dependabot bumps via the trailing tag comment.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      fail-on-vuln: false
