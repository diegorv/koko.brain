name: Security

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".scratch/**"
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:
  workflow_call:
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust: "false"

      - name: Audit dependencies (quarantine-aware)
        run: node scripts/quarantine-aware-audit.mjs

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Audit dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          ignore: RUSTSEC-2024-0429,RUSTSEC-2026-0367,RUSTSEC-2026-0368,RUSTSEC-2026-0369

  supply-chain-quarantine:
    name: Supply Chain Quarantine
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify pnpm-workspace.yaml exists
        run: |
          if [[ ! -f pnpm-workspace.yaml ]]; then
            echo "::error::pnpm-workspace.yaml is missing — supply chain quarantine is disabled!"
            exit 1
          fi

      - name: Verify minimumReleaseAge is configured
        run: |
          age=$(grep -oP 'minimumReleaseAge:\s*\K\d+' pnpm-workspace.yaml || true)
          if [[ -z "$age" ]]; then
            echo "::error::minimumReleaseAge is not set in pnpm-workspace.yaml"
            exit 1
          fi
          min_age=10080  # 7 days in minutes
          if [[ "$age" -lt "$min_age" ]]; then
            echo "::error::minimumReleaseAge is $age minutes ($(( age / 1440 )) days), minimum required is $min_age minutes (7 days)"
            exit 1
          fi
          echo "✅ minimumReleaseAge is $age minutes ($(( age / 1440 )) days)"

  gitleaks-history:
    name: Secret Scan (full history)
    # Own triggers only: under workflow_call, event_name is the caller's.
    if: >-
      github.workflow == 'Security' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # The action defaults to 8.24.3, which silently ignores `[[allowlists]]`.
          GITLEAKS_VERSION: "8.30.1"

  osv-scanner:
    name: OSV Scanner (full tree)
    # Own triggers only: callers narrow the token and the SARIF upload fails.
    if: github.workflow == 'Security'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      fail-on-vuln: false
