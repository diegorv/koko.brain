name: Security

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  push:
    # Solo project: commits land directly on main, so the full security
    # suite runs on every push (Actions is free on this public repo). This
    # is the primary trigger; PR / dispatch / cron are secondary.
    branches: [main]
    paths-ignore:
      - "**/*.md"
  schedule:
    # Daily full-tree OSV scan (12:30 UTC). Catches advisories disclosed
    # for unchanged dependencies on days with no push.
    - cron: "30 12 * * *"
  workflow_dispatch:
  # Reusable: invoked by `.github/workflows/release.yml` and
  # `.github/workflows/run-all.yml`.
  workflow_call:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          rust: "false"

      - name: Audit dependencies (quarantine-aware)
        # `pnpm audit` exits non-zero on any moderate-or-higher advisory,
        # which conflicts with our own 7-day supply-chain quarantine
        # (`minimumReleaseAge` in pnpm-workspace.yaml). When upstream ships
        # a security patch there is a window where the advisory is public
        # but the patch is still inside the quarantine — we *cannot*
        # install it and we shouldn't fail CI for it. The script downgrades
        # those advisories to `::warning::` and only fails the job when at
        # least one patched version is already outside the quarantine
        # window (i.e. we should have updated and didn't). See
        # `scripts/quarantine-aware-audit.mjs` for the full classification.
        run: node scripts/quarantine-aware-audit.mjs

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level permissions REPLACE workflow-level (they're not merged),
    # so the `contents: read` baseline has to be redeclared alongside
    # the `checks: write` escalation required by `rustsec/audit-check`.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Audit dependencies
        # Pinned by commit SHA, not tag — same supply-chain reasoning
        # as the other third-party actions. Dependabot bumps via the
        # trailing `# v2.0.0` tag comment.
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  supply-chain-quarantine:
    name: Supply Chain Quarantine
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Verify pnpm-workspace.yaml exists
        run: |
          if [[ ! -f pnpm-workspace.yaml ]]; then
            echo "::error::pnpm-workspace.yaml is missing — supply chain quarantine is disabled!"
            exit 1
          fi

      - name: Verify minimumReleaseAge is configured
        run: |
          age=$(grep -oP 'minimumReleaseAge:\s*\K\d+' pnpm-workspace.yaml || true)
          if [[ -z "$age" ]]; then
            echo "::error::minimumReleaseAge is not set in pnpm-workspace.yaml"
            exit 1
          fi
          min_age=10080  # 7 days in minutes
          if [[ "$age" -lt "$min_age" ]]; then
            echo "::error::minimumReleaseAge is $age minutes ($(( age / 1440 )) days), minimum required is $min_age minutes (7 days)"
            exit 1
          fi
          echo "✅ minimumReleaseAge is $age minutes ($(( age / 1440 )) days)"

  osv-scanner:
    name: OSV Scanner (full tree)
    # Full-tree OSV scan (pnpm lockfile + Cargo.lock) -> Security tab. Unified
    # dashboard on top of npm-audit (GHSA) and cargo-audit (RustSec). Report-only
    # (`fail-on-vuln: false`) — never fails the build, same stance as npm-audit.
    #
    # `github.workflow == 'Security'` = run only when this workflow fires on its
    # own triggers (push / PR / cron / dispatch). Skips the workflow_call
    # invocations from release.yml / run-all.yml, where the caller narrows the
    # token and the SARIF upload would fail.
    if: github.workflow == 'Security'
    # Job-level permissions REPLACE workflow-level (they're not merged), so the
    # `contents: read` baseline is redeclared alongside the escalations the
    # reusable workflow needs to push SARIF to the Security tab.
    permissions:
      actions: read
      contents: read
      security-events: write
    # Pinned by commit SHA, not tag — same supply-chain reasoning as the other
    # third-party actions. Dependabot bumps via the trailing tag comment.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      fail-on-vuln: false
