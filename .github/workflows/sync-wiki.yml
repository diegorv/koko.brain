name: Wiki Sync

on:
  push:
    branches: [main]
    paths:
      - "help/documentation/**"
      - "help/examples/**"
      - "scripts/sync-wiki-docs.mjs"

  workflow_dispatch:
concurrency:
  group: sync-wiki-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v7.0.1

      - name: Checkout wiki repo
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync documentation to wiki
        run: |
          set -euo pipefail
          cd wiki

          find . -maxdepth 1 -name '*.md' -delete
          node ../scripts/sync-wiki-docs.mjs ../help/documentation . \
            "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/help/documentation/"

      - name: Sync examples to wiki
        run: |
          set -euo pipefail
          cd wiki

          for dir in ../help/examples/*/; do
            dirname=$(basename "$dir")
            [ "$dirname" = ".DS_Store" ] && continue

            title=$(echo "$dirname" \
              | sed 's/-/ /g' \
              | sed 's/\b\(.\)/\u\1/g')
            dest="Examples ${title}.md"

            echo "# Examples: ${title}" > "$dest"
            echo "" >> "$dest"
            echo "Sample files for the **${title}** feature." >> "$dest"
            echo "" >> "$dest"

            find "$dir" -type f ! -name '.DS_Store' | sort | while read -r f; do
              fname=$(basename "$f")
              relpath="${f#$dir}"
              ext="${fname##*.}"

              echo "---" >> "$dest"
              echo "" >> "$dest"
              echo "## \`${relpath}\`" >> "$dest"
              echo "" >> "$dest"

              case "$ext" in
                md)         lang="markdown" ;;
                js)         lang="javascript" ;;
                collection) lang="yaml" ;;
                *)          lang="" ;;
              esac

              echo "\`\`\`${lang}" >> "$dest"
              cat "$f" >> "$dest"
              echo "" >> "$dest"
              echo "\`\`\`" >> "$dest"
              echo "" >> "$dest"
            done
          done

      - name: Commit and push to wiki
        run: |
          set -euo pipefail
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to commit."
          else
            git commit -m "docs: sync wiki from help/documentation"
            git push
          fi
