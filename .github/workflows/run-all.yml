name: Run All Checks

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml

  security:
    name: Security
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/security.yml

  privacy:
    name: Privacy
    uses: ./.github/workflows/privacy.yml
