name: Run All Checks

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets:
      MODS_REPO_READ_TOKEN: ${{ secrets.MODS_REPO_READ_TOKEN }}

  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml
    secrets:
      MODS_REPO_READ_TOKEN: ${{ secrets.MODS_REPO_READ_TOKEN }}

  secrets:
    name: Secret Scan
    uses: ./.github/workflows/secrets.yml

  security:
    name: Security
    # Union of every permission security.yml requests: GitHub validates them
    # before evaluating any job `if`, so a missing one fails the whole call.
    permissions:
      contents: read
      checks: write
      actions: read
      security-events: write
    uses: ./.github/workflows/security.yml
    secrets:
      MODS_REPO_READ_TOKEN: ${{ secrets.MODS_REPO_READ_TOKEN }}

  privacy:
    name: Privacy
    uses: ./.github/workflows/privacy.yml
