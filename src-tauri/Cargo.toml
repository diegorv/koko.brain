[package]
name = "kokobrain"
version = "3.0.12"
description = "Markdown second-brain app"
authors = ["Diego R.V."]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kokobrain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
# Tauri 3 alpha: exact pins on purpose (see .scratch/tauri-v3/). They only
# cover the direct dependencies. tauri, tauri-runtime-wry, tauri-macros,
# tauri-build and the plugins require tauri-runtime / tauri-utils /
# tauri-macros / tauri-codegen / tauri-plugin with `~3.0.0-alpha.N`, which
# accepts later alphas. The committed Cargo.lock is what holds those: bump
# every tauri crate together, never with a bare `cargo update`.
#
# No `macos-private-api` feature: alpha.5 dropped it from both `tauri` and
# `tauri-runtime-wry` (transparent windows are no longer feature-gated).
tauri = { version = "=3.0.0-alpha.5", features = ["protocol-asset"] }
tauri-runtime-wry = "=3.0.0-alpha.5"
tauri-plugin-opener = "=3.0.0-alpha.3"
tauri-plugin-fs = "=3.0.0-alpha.3"
tauri-plugin-dialog = "=3.0.0-alpha.4"
tauri-plugin-deep-link = "=3.0.0-alpha.3"
tauri-plugin-clipboard-manager = "=3.0.0-alpha.3"
tauri-plugin-global-shortcut = "=3.0.0-alpha.3"

# Quick Capture (clipboard adapter, kind detection, image re-encode)
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
notify = "8"

# Debug / metrics
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# Shared infrastructure
chrono = "0.4"
rmp-serde = "1.3"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.11"

# File History
similar = "3.1"

# Semantic Search
ort = { version = "2.0.0-rc.13", features = ["download-binaries", "ndarray", "half"] }
half = "2.7"
ndarray = "0.17"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
reqwest = { version = "0.13", features = ["stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util"] }
tauri-plugin-http = "=3.0.0-alpha.3"
# Without the default `zip` feature: it only serves the Windows/Linux update
# paths (macOS updates are .app.tar.gz, extracted with the unconditional
# tar + flate2 deps), and every 3.0.0-alpha pins zip ^4, which carries
# RUSTSEC-2026-0367/0368/0369 (fixed in zip 9).
tauri-plugin-updater = { version = "=3.0.0-alpha.3", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "=3.0.0-alpha.3"
url = "2"
sentry = { version = "0.49.2", default-features = false, features = ["backtrace", "contexts", "panic", "transport"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }

[profile.dev]
# More parallel codegen units = faster compilation (trades runtime perf for build speed)
codegen-units = 256
# Faster incremental linking on macOS
split-debuginfo = "unpacked"

[profile.release]
# Thin LTO: good optimization with much faster link times than fat LTO
lto = "thin"
# Strip symbols for smaller binaries
strip = true
# Single codegen unit for best optimization in release
codegen-units = 1

# Local "did it still compile / does it still work" release profile.
# Inherits from `release` but trades the LTO link and the single-CGU
# rebuild for parallel codegen and a much faster relink. Use via
# `cargo build --profile release-fast` or `pnpm tauri:build:fast`.
# Do NOT use for shipped builds - the binary is bigger and slightly
# less optimized; that's what `release` is for.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

