[package]
name = "kokobrain"
version = "3.0.2"
description = "Markdown second-brain app"
authors = ["Diego R.V."]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kokobrain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["semantic", "desktop-integration"]
# ONNX Runtime semantic search: embedder, reranker, model download and the
# `*_semantic*` / `search_hybrid` commands. Never compiled for iOS / Android
# (build.rs turns the `semantic` cfg off there regardless of this feature),
# and `--no-default-features` reproduces that mobile profile on a desktop
# host - see docs/IOS.md.
semantic = ["dep:ort", "dep:half", "dep:ndarray", "dep:tokenizers", "dep:reqwest", "dep:futures-util"]
# Desktop shell integration: native menu bar, quick-capture composer window
# + clipboard capture, global shortcuts, in-app updater and process restart.
# Same mobile rule as `semantic` (cfg `desktop_integration`).
desktop-integration = [
	"dep:tauri-plugin-global-shortcut",
	"dep:tauri-plugin-updater",
	"dep:tauri-plugin-process",
	"dep:arboard",
	"dep:image",
	"dep:mime_guess",
	"dep:url",
]

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
notify = "8"

# Debug / metrics
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# Shared infrastructure
chrono = "0.4"
rmp-serde = "1.3"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"

# File History
similar = "3.1"

# Shared async runtime (vault commands use `spawn_blocking`; the semantic
# model download uses the fs / io helpers).
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util"] }
tauri-plugin-http = "2"

# Desktop-only crates. Declared for non-mobile targets only so an iOS /
# Android build never resolves them, and optional so the `semantic` /
# `desktop-integration` features can switch them off on a desktop host.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
# Semantic Search
ort = { version = "2.0.0-rc.13", features = ["download-binaries", "ndarray", "half"], optional = true }
half = { version = "2.7", optional = true }
ndarray = { version = "0.17", optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }
reqwest = { version = "0.13", features = ["stream"], optional = true }
futures-util = { version = "0.3", optional = true }
# Desktop shell integration
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-updater = { version = "2.10.1", optional = true }
tauri-plugin-process = { version = "2.3.1", optional = true }
url = { version = "2", optional = true }
# Quick Capture (clipboard adapter, kind detection, image re-encode)
arboard = { version = "3", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
mime_guess = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }

[profile.dev]
# More parallel codegen units = faster compilation (trades runtime perf for build speed)
codegen-units = 256
# Faster incremental linking on macOS
split-debuginfo = "unpacked"

[profile.release]
# Thin LTO: good optimization with much faster link times than fat LTO
lto = "thin"
# Strip symbols for smaller binaries
strip = true
# Single codegen unit for best optimization in release
codegen-units = 1

# Local "did it still compile / does it still work" release profile.
# Inherits from `release` but trades the LTO link and the single-CGU
# rebuild for parallel codegen and a much faster relink. Use via
# `cargo build --profile release-fast` or `pnpm tauri:build:fast`.
# Do NOT use for shipped builds - the binary is bigger and slightly
# less optimized; that's what `release` is for.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Offline retrieval eval (docs/SEARCH.md) drives the ONNX models directly.
[[example]]
name = "retrieval_eval"
required-features = ["semantic"]

